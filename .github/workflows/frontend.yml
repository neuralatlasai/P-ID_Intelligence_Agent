name: Frontend

# The frontend has its own workflow because it has its own toolchain and its own gate. A
# change to Python must not wait on a browser download, and a change to TypeScript must not
# wait on a corpus scan.

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  gate:
    name: Quality gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the lockfile, which is what makes the build reproducible.
      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        # No network, no model: the streaming path runs against mocked gateway responses.
        run: npm run test

      - name: Build
        # BACKEND_BASE_URL is required in production. A build without it must fail, which is
        # the point of setting a placeholder here rather than leaving it unset.
        run: npm run build
        env:
          BACKEND_BASE_URL: http://127.0.0.1:8000

      - name: Prove the backend URL is absent from the browser bundle
        # The gateway is server-only. If this string ever reaches a client chunk, the
        # backend's location is public.
        run: |
          if grep -rl "127.0.0.1:8000" .next/static 2>/dev/null; then
            echo "::error::BACKEND_BASE_URL leaked into the browser bundle"
            exit 1
          fi
          echo "Backend URL is absent from every client chunk."

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit
        run: npm audit --audit-level=moderate

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the backend
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Install the frontend
        run: npm ci

      - name: Install the browser
        run: npm run test:e2e:install

      - name: Build
        run: npm run build
        env:
          BACKEND_BASE_URL: http://127.0.0.1:8000

      - name: Start the backend with a scripted model
        working-directory: .
        run: |
          python scripts/demo_backend.py 8000 &
          # Wait for readiness rather than sleeping: a fixed sleep is either too short on a
          # slow runner or wasted time on a fast one.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null 2>&1; then
              echo "Backend ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Backend did not become ready"
          exit 1

      - name: Run the suite
        run: npm run test:e2e
        env:
          BACKEND_BASE_URL: http://127.0.0.1:8000
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
